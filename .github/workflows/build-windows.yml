name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nsis:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Read version
        id: ver
        shell: pwsh
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run pack:nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer (CI only — install from GitHub Releases)
        uses: actions/upload-artifact@v4
        with:
          name: InsyncOwn-${{ steps.ver.outputs.version }}-win64-installer
          path: release/InsyncOwn-*-win64.exe
          if-no-files-found: error
