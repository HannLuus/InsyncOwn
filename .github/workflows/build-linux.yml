name: Build Debian

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deb:
    name: Ubuntu/Debian .deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package .deb
        run: npm run pack:deb -w insyncown
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: insyncown-amd64-deb
          path: release/*.deb
          if-no-files-found: error
