name: Build Debian

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deb:
    name: Ubuntu/Debian .deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Read version
        id: ver
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build and package .deb
        run: npm run pack:deb
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload .deb (CI only — install from GitHub Releases)
        uses: actions/upload-artifact@v4
        with:
          name: InsyncOwn-${{ steps.ver.outputs.version }}-amd64-deb
          path: release/InsyncOwn-*.deb
          if-no-files-found: error
